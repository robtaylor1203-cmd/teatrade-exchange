name: Monthly Auction Benchmark Ingest

on:
  schedule:
    # World Bank Pink Sheet publishes ~2nd of each month; run on the 5th at 07:00 UTC.
    - cron: '0 7 5 * *'
  workflow_dispatch: # Allow manual runs from the GitHub Actions tab

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        working-directory: ./scraper
        run: npm install --no-audit --no-fund

      - name: Ingest World Bank benchmarks
        working-directory: ./scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run benchmarks
