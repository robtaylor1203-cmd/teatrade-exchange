name: Tea News Scraper

on:
  schedule:
    # Every 6 hours — keeps the live news feed fresh without burning tokens.
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual triggering from the GH interface

jobs:
  scrape-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './scraper/package.json'

      - name: Install Dependencies
        working-directory: ./scraper
        run: npm ci

      - name: Run Tea News Scraper
        working-directory: ./scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run news
